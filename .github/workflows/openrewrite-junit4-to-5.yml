name: OpenRewrite - Migrate JUnit 4 to JUnit 5

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      WORKING_DIRECTORY:
        description: 'Subdirectory containing the Maven/Gradle project (monorepo support)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  vulnerability-alerts: read   # to check for related open Dependabot alerts, below

env:
  BRANCH: rewrite/junit4-to-5

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if a PR from a previous run is still open
        id: existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
          echo "open_pr_count=$count" >> "$GITHUB_OUTPUT"

      - name: Check for related open Dependabot alerts
        id: alerts
        if: steps.existing_pr.outputs.open_pr_count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh api's error body on a non-2xx response goes to stdout, not just stderr, and
          # exits non-zero — so `2>/dev/null || echo 0` alone doesn't work: the failed
          # command's stdout gets captured *and* "0" gets appended after it. Check success
          # explicitly instead of relying on the exit code inside a substitution.
          if raw=$(gh api "repos/${GITHUB_REPOSITORY}/dependabot/alerts?state=open&severity=critical,high&per_page=100" \
            --jq '[.[] | select(.dependency.package.ecosystem == "maven")] | length' 2>/dev/null); then
            count="$raw"
          else
            count=0
          fi
          echo "critical_high_count=${count:-0}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.existing_pr.outputs.open_pr_count == '0'
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run OpenRewrite recipe
        if: steps.existing_pr.outputs.open_pr_count == '0'
        working-directory: java-service   # pom.xml lives here, not repo root — see SPEC.md 3.16
        run: |
          mvn -B org.openrewrite.maven:rewrite-maven-plugin:6.12.0:run \
            -Drewrite.activeRecipes=org.openrewrite.java.testing.junit5.JUnit5BestPractices \
            -Drewrite.recipeArtifactCoordinates=org.openrewrite.recipe:rewrite-testing-frameworks:3.11.0 \
            -Drewrite.exportDatatables=true

      - name: Check for changes
        id: diff
        if: steps.existing_pr.outputs.open_pr_count == '0'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sanity-check compile (full verification happens via this repo's normal CI on the PR)
        if: steps.existing_pr.outputs.open_pr_count == '0' && steps.diff.outputs.changed == 'true'
        working-directory: java-service
        run: mvn -B -q test-compile

      - name: Upload OpenRewrite report
        if: steps.existing_pr.outputs.open_pr_count == '0' && steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rewrite-datatables-junit4-to-5
          path: java-service/target/rewrite/**

      - name: Detect real current version, resolve CODEOWNERS, build enrichment notes
        id: enrichment
        if: steps.existing_pr.outputs.open_pr_count == '0' && steps.diff.outputs.changed == 'true'
        run: |
          # Embedded, self-contained for the same reason the jscodeshift transforms
          # are embedded elsewhere in this project: tech-stack-advisor isn't (yet) a
          # pushed, fetchable GitHub repo. Keep in sync by hand with
          # scripts/pr_enrichment.py + enterprise_pr_rules.py if either changes.
          cat > /tmp/pr_enrichment.py <<'ENRICH_EOF'
          import re
          from pathlib import Path

          COOKBOOK_DEPENDENCY_PATTERNS: list[str] = []
          COOKBOOK_WARNING = (
              "\u26a0\ufe0f **Cookbook-server compatibility** \u2014 this repo depends on the internal cookbook "
              "client. Verify cookbook version compatibility and check for auto-registered filters "
              "(e.g. a proxy-header filter) that can silently 404 requests behind the gateway."
          )
          DOCKER_MOUNTPOINT_FILES: list[str] = ["Docker.aws.json.erb"]
          DOCKER_MOUNTPOINT_WARNING = (
              "\u26a0\ufe0f **Docker/Tomcat mountpoint** \u2014 this repo has a `{filename}` config. Confirm its "
              "Tomcat mountpoint version was bumped to match this upgrade's base image/JDK target \u2014 "
              "a missed mountpoint means Tomcat silently ignores the newer servlet descriptor and "
              "every URL 404s with no obvious cause."
          )

          working_dir = "java-service"

          def detect_current_version():
              pom = Path(working_dir) / 'pom.xml'
              if not pom.exists():
                  return 'unknown'
              content = pom.read_text(errors='replace')
              lines = content.splitlines()
              found = False
              for line in lines:
                  if 'junit'.lower() in line.lower():
                      found = True
                  if found and '<version>' in line:
                      m = re.search(r'<version>([^<]+)</version>', line)
                      if m:
                          return m.group(1).strip()
              return 'unknown'

          def resolve_reviewers() -> tuple[list[str], list[str]]:
              content = None
              for candidate in ("CODEOWNERS", ".github/CODEOWNERS", "docs/CODEOWNERS"):
                  p = Path(candidate)
                  if p.exists():
                      content = p.read_text(errors="replace")
                      break
              if not content:
                  return [], []
              changed_path = f"{working_dir}/pom.xml"
              matched: list[str] = []
              for line in content.splitlines():
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  if len(parts) < 2:
                      continue
                  pattern, owners = parts[0], parts[1:]
                  if pattern == "*":
                      matched = owners
                  elif pattern.startswith("*.") and changed_path.endswith(pattern[1:]):
                      matched = owners
                  elif changed_path == pattern.lstrip("/") or changed_path.startswith(pattern.lstrip("/").rstrip("/") + "/"):
                      matched = owners
              reviewers, team_reviewers = [], []
              for handle in matched:
                  h = handle.lstrip("@")
                  if "/" in h:
                      team_reviewers.append(h.split("/", 1)[1])
                  else:
                      reviewers.append(h)
              return reviewers, team_reviewers

          def enrichment_body() -> str:
              notes = []
              if COOKBOOK_DEPENDENCY_PATTERNS:
                  pom = Path(working_dir) / "pom.xml"
                  if pom.exists() and any(p.lower() in pom.read_text(errors="replace").lower() for p in COOKBOOK_DEPENDENCY_PATTERNS):
                      notes.append(COOKBOOK_WARNING)
              for filename in DOCKER_MOUNTPOINT_FILES:
                  if (Path(working_dir) / filename).exists() or Path(filename).exists():
                      notes.append(DOCKER_MOUNTPOINT_WARNING.format(filename=filename))
                      break
              notes.append("- [ ] Endpoint-by-endpoint Postman validation through every gateway this service sits behind, before and after \u2014 not just \"CI passed\".")
              return "\n\n".join(notes)

          current_version = detect_current_version()
          reviewers, team_reviewers = resolve_reviewers()
          body = enrichment_body()

          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"current_version={current_version}\n")
              f.write(f"reviewers={','.join(reviewers)}\n")
              f.write(f"team_reviewers={','.join(team_reviewers)}\n")
              f.write(f"enrichment_body<<PR_ENRICHMENT_EOF\n{body}\nPR_ENRICHMENT_EOF\n")
          ENRICH_EOF
          python3 /tmp/pr_enrichment.py

      - name: Open draft PR
        if: steps.existing_pr.outputs.open_pr_count == '0' && steps.diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.OPENREWRITE_PR_TOKEN }}
          commit-message: "chore(rewrite): apply JUnit5BestPractices"
          branch: rewrite/junit4-to-5
          title: "chore: migrate ${{ github.event.repository.name }} JUnit ${{ steps.enrichment.outputs.current_version }} tests to JUnit 5 (OpenRewrite)"
          draft: true
          labels: openrewrite, major-upgrade, testing
          # Resolved from this repo's own real CODEOWNERS (see the enrichment step
          # above) instead of a REPLACE_WITH_REVIEWER_HANDLE placeholder. Empty
          # strings are fine — the action just requests no one, same as before.
          reviewers: ${{ steps.enrichment.outputs.reviewers }}
          team-reviewers: ${{ steps.enrichment.outputs.team_reviewers }}
          body: |
            Automated via OpenRewrite recipe `org.openrewrite.java.testing.junit5.JUnit5BestPractices`.
            
            🛑 Open critical/high Dependabot alerts on this ecosystem right now: ${{ steps.alerts.outputs.critical_high_count }} — this PR may resolve some of them; check the Security tab after merging.
            Run this before the Spring Boot 3.0 recipe if the repo's tests still use JUnit 4 —
            Spring Boot 3.x's test-slice annotations assume JUnit 5.

            **Do not merge without:**
            - [ ] Waiting for this repo's normal CI to run on this PR (uses a PAT so checks trigger correctly)
            - [ ] Spot-checking a few converted test classes for correct assertion/annotation mapping
            - [ ] Checking the uploaded `rewrite-datatables` artifact for a full list of applied changes

            ## 🏢 Enterprise Context

            ${{ steps.enrichment.outputs.enrichment_body }}

      - name: Notify Slack (no-op if webhook secret is not set)
        if: steps.existing_pr.outputs.open_pr_count == '0' && steps.diff.outputs.changed == 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ] && [ -n "$PR_URL" ]; then
            curl -fsS -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\"OpenRewrite opened a draft PR: $PR_URL\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
